services:
  - type: web
    name: amber-api
    runtime: python
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt && cd backend && python manage.py collectstatic --noinput
    startCommand: cd backend && python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: amber-postgres-sg
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: FRONTEND_ORIGIN
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: SESSION_COOKIE_SAMESITE
        value: "None"
      - key: CSRF_COOKIE_SAMESITE
        value: "None"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"
      - key: CLOUDINARY_URL
        sync: false

  - type: worker
    name: amber-ocr-worker
    runtime: python
    plan: standard
    region: singapore
    branch: main
    autoDeploy: true
    numInstances: 1
    buildCommand: pip install -r requirements-worker.txt
    startCommand: cd backend && python manage.py run_ocr_worker --poll-seconds 2
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: amber-postgres-sg
          property: connectionString
      - key: CLOUDINARY_URL
        fromService:
          type: web
          name: amber-api
          envVarKey: CLOUDINARY_URL
      - key: PADDLE_PDX_MODEL_SOURCE
        value: BOS
      - key: PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK
        value: "True"
      - key: PADDLE_OCR_VERSION
        value: PP-OCRv3
      - key: PADDLE_ENABLE_MKLDNN
        value: "False"

databases:
  - name: amber-postgres-sg
    databaseName: amber
    user: amber
    region: singapore
    plan: free
    postgresMajorVersion: "16"
    ipAllowList: []
